# SadSha Scanner — release AAB for Google Play
# NOT VERIFIED end-to-end: needs Qasim's release keystore in GitHub secrets
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Manual dispatch only. Do NOT run until the secrets exist.
name: SadSha Scanner — release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ID: com.sadsha.scanner
      APP_RESOURCES: App_Resources/documentscanner
      APP_BUILD_PATH: build/documentscanner
      PROJECT_NAME: nsdocumentscanner
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # NOTE: android-actions/setup-android@v3 fails here: its `sdkmanager
      # --licenses` call prompts interactively (7 of 8 licenses unaccepted)
      # and exits 1. The runner already ships the Android SDK preinstalled,
      # so we accept licenses non-interactively with `yes |` instead.
      - name: Accept SDK licenses + install platform, build-tools, NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null
          yes | "$SDKMGR" --install "platforms;android-36" "build-tools;36.1.0" "ndk;27.3.13750724" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Install NativeScript CLI
        run: |
          npm i -g @akylas/nativescript-cli --ignore-scripts --legacy-peer-deps
          ns package-manager set yarn2
          ns usage-reporting disable
          ns error-reporting disable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fetch dev resources (OpenCV + Tesseract)
        run: |
          curl -fL --retry 3 -o /tmp/android.zip "https://github.com/ossappscollective/OSS-DocumentScanner/releases/download/dev_resources/android.zip"
          unzip -o -q /tmp/android.zip
          ls opencv/android/staticlibs/arm64-v8a/libopencv_core.a tesseract/android/staticlibs/arm64-v8a/libtesseract.a

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sadsha-scanner.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/sadsha-scanner.keystore" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ns build android --release --clean \
            --key-store-path "$KEYSTORE_PATH" \
            --key-store-password "$KEYSTORE_PASSWORD" \
            --key-store-alias "$KEY_ALIAS" \
            --key-store-alias-password "$KEY_PASSWORD" \
            --env.adhoc --env.sentry=0 --env.sourceMap=0 --aab

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sadsha-scanner-release-aab
          path: build/documentscanner/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
